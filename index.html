
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142432">
<title>Whiteout Truppenrechner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101b27;color:white;
font-family:Arial,sans-serif;padding:20px}
main{max-width:480px;margin:auto}
h1{font-size:25px;text-align:center}
p{text-align:center;color:#a8bdce}
.card{background:#1d3040;padding:18px;
border-radius:16px;margin:16px 0}
label{display:block;margin:12px 0 6px}
input{width:100%;padding:14px;font-size:20px;
border:1px solid #537084;border-radius:10px;
background:#10212f;color:white}
.result{display:flex;justify-content:space-between;
padding:14px 0;border-bottom:1px solid #40576a}
strong{color:#8cdeef}
button{width:100%;padding:15px;border:0;
border-radius:12px;background:#80d5e6;
color:#10212f;font-size:17px;font-weight:bold}
#error{color:#ffb4a8}
</style>
</head>
<body>
<main>
<h1>❄️ Whiteout Truppenrechner</h1>
<p>Gesamttruppen & Prozentverteilung</p>

<div class="card">
<label>Gesamttruppen</label>
<input id="total" type="number" min="0" value="100000">

<label>Infanterie %</label>
<input id="inf" type="number" min="0" max="100" value="50">

<label>Lanzenreiter %</label>
<input id="lan" type="number" min="0" max="100" value="20">

<label>Schützen %</label>
<input id="sch" type="number" min="0" max="100" value="30">
</div>

<div class="card">
<h2>Ergebnis</h2>
<div class="result"><span>Infanterie</span><strong id="a">0</strong></div>
<div class="result"><span>Lanzenreiter</span><strong id="b">0</strong></div>
<div class="result"><span>Schützen</span><strong id="c">0</strong></div>
<div class="result"><span>Gesamt</span><strong id="sum">0</strong></div>
<p id="error"></p>
<button onclick="copyResult()">Ergebnis kopieren</button>
</div>
</main>

<script>
const ids=["total","inf","lan","sch"];
const get=id=>Number(document.getElementById(id).value);
const fmt=n=>n.toLocaleString("de-DE");
let result=[0,0,0];

function calculate(){
 const total=get("total");
 const rates=["inf","lan","sch"].map(get);
 const valid=Number.isSafeInteger(total)&&total>=0&&
 rates.every(x=>Number.isFinite(x)&&x>=0&&x<=100)&&
 Math.abs(rates.reduce((a,b)=>a+b,0)-100)<0.000001;

 document.getElementById("error").textContent=
 valid?"":"Bitte gültige Werte eingeben. Die Prozente müssen 100 % ergeben.";

 if(!valid){
 ["a","b","c","sum"].forEach(id=>
 document.getElementById(id).textContent="–");
 return;
 }

 const exact=rates.map(x=>total*x/100);
 result=exact.map(Math.floor);
 let rest=total-result.reduce((a,b)=>a+b,0);
 const order=[0,1,2].sort((a,b)=>
 (exact[b]-result[b])-(exact[a]-result[a]));
 for(let i=0;i<rest;i++)result[order[i%3]]++;

 ["a","b","c"].forEach((id,i)=>
 document.getElementById(id).textContent=fmt(result[i]));
 document.getElementById("sum").textContent=fmt(total);
 localStorage.setItem("whiteout-simple",JSON.stringify(
 ids.map(id=>document.getElementById(id).value)));
}

function copyResult(){
 const names=["Infanterie","Lanzenreiter","Schützen"];
 const text=names.map((name,i)=>name+": "+fmt(result[i])).join("\n");
 if(navigator.clipboard)navigator.clipboard.writeText(text);
}

try{
 const saved=JSON.parse(localStorage.getItem("whiteout-simple"));
 if(Array.isArray(saved)&&saved.length===4)
 ids.forEach((id,i)=>document.getElementById(id).value=saved[i]);
}catch(e){}

ids.forEach(id=>document.getElementById(id)
.addEventListener("input",calculate));
calculate();
</script>
</body>
</html>
